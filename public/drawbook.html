<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32 Drawbook</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { max-width: 760px; margin: 32px auto; padding: 0 16px; color: #202124; }
    h1 { font-size: 1.5rem; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    button { padding: 9px 14px; border: 1px solid #777; border-radius: 4px; background: #fff; cursor: pointer; }
    button.active { background: #202124; color: white; }
    #status { margin-left: 8px; font-weight: bold; }
    .canvas-wrap { width: 100%; max-width: 768px; padding: 8px 0; }
    .canvas-frame { width: 100%; aspect-ratio: 4 / 1; box-sizing: border-box; overflow: hidden; border: 1px solid #555; background: white; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; cursor: crosshair; }
    #message { min-height: 1.25em; color: #8a1c1c; }
  </style>
</head>
<body>
  <h1>ESP32 Drawbook</h1>
  <div>WebSocket: <span id="status">Disconnected</span></div>
  <form action="/logout" method="post">
    <button type="submit">Log out</button>
  </form>
  <div class="toolbar" role="group" aria-label="Drawing tools">
    <button id="drawButton" class="active" type="button">Draw</button>
    <button id="eraseButton" type="button">Erase</button>
    <button id="clearButton" type="button">Clear</button>
    <button id="sendButton" type="button">Send</button>
  </div>
  <div class="canvas-wrap">
    <div class="canvas-frame">
      <canvas id="drawbook" width="128" height="32" aria-label="128 by 32 pixel drawing canvas"></canvas>
    </div>
  </div>
  <div id="message" role="status" aria-live="polite"></div>

  <script>
    'use strict';
    const WIDTH = 128;
    const HEIGHT = 32;
    const canvas = document.getElementById('drawbook');
    const context = canvas.getContext('2d', { alpha: false });
    const status = document.getElementById('status');
    const message = document.getElementById('message');
    const pixels = new Uint8Array(WIDTH * HEIGHT);
    let drawing = false;
    let pixelValue = 1;
    let socket;
    let reconnectTimer;
    let authenticated = false;

    function setAuthenticated(value) {
      authenticated = value;
      document.querySelectorAll('.toolbar button').forEach((button) => { button.disabled = !value; });
    }

    function render() {
      const image = context.createImageData(WIDTH, HEIGHT);
      for (let i = 0; i < pixels.length; i += 1) {
        const color = pixels[i] ? 0 : 255;
        const offset = i * 4;
        image.data[offset] = color;
        image.data[offset + 1] = color;
        image.data[offset + 2] = color;
        image.data[offset + 3] = 255;
      }
      context.putImageData(image, 0, 0);
    }

    function setTool(value, activeButton) {
      pixelValue = value;
      document.querySelectorAll('.toolbar button').forEach((button) => button.classList.remove('active'));
      activeButton.classList.add('active');
    }

    function paintAt(event) {
      const bounds = canvas.getBoundingClientRect();
      const x = Math.max(0, Math.min(WIDTH - 1, Math.floor((event.clientX - bounds.left) * WIDTH / bounds.width)));
      const y = Math.max(0, Math.min(HEIGHT - 1, Math.floor((event.clientY - bounds.top) * HEIGHT / bounds.height)));
      pixels[y * WIDTH + x] = pixelValue;
      render();
    }

    function frameString() {
      let data = '';
      for (let i = 0; i < pixels.length; i += 1) data += pixels[i] ? '1' : '0';
      return data;
    }

    function sendFrame() {
      message.textContent = '';
      if (!authenticated) {
        message.textContent = 'Error: Authenticate before sending';
        return;
      }
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        message.textContent = 'Error: WebSocket is disconnected';
        return;
      }
      socket.send(JSON.stringify({ type: 'draw', data: frameString() }));
      message.textContent = 'Sending';
    }

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(`${protocol}//${location.host}/ws`);
      socket.addEventListener('open', () => {
        status.textContent = 'Connected';
        message.textContent = 'Checking session';
      });
      socket.addEventListener('message', (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'auth_success') {
            setAuthenticated(true);
            message.textContent = 'Authenticated';
          } else if (data.type === 'error') {
            message.textContent = `Error: ${data.message}`;
          }
          else if (data.type === 'device_status') message.textContent = `Device ${data.device_id}: ${data.status}`;
        } catch (_error) {
          message.textContent = 'Error: Invalid server response';
        }
      });
      socket.addEventListener('close', () => {
        status.textContent = 'Disconnected';
        setAuthenticated(false);
        if (reconnectTimer) clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, 3000);
      });
      socket.addEventListener('error', () => {
        status.textContent = 'Disconnected';
      });
    }

    canvas.addEventListener('pointerdown', (event) => {
      drawing = true;
      canvas.setPointerCapture(event.pointerId);
      paintAt(event);
    });
    canvas.addEventListener('pointermove', (event) => {
      if (drawing) paintAt(event);
    });
    function finishStroke() {
      if (!drawing) return;
      drawing = false;
      sendFrame();
    }
    canvas.addEventListener('pointerup', finishStroke);
    canvas.addEventListener('pointercancel', finishStroke);
    document.getElementById('drawButton').addEventListener('click', (event) => setTool(1, event.currentTarget));
    document.getElementById('eraseButton').addEventListener('click', (event) => setTool(0, event.currentTarget));
    document.getElementById('clearButton').addEventListener('click', () => {
      pixels.fill(0);
      render();
      message.textContent = '';
    });
    document.getElementById('sendButton').addEventListener('click', sendFrame);

    setAuthenticated(false);
    render();
    connect();
  </script>
</body>
</html>
